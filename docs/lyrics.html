<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e10;
      --surface:  #18181c;
      --border:   #2a2a30;
      --accent:   #c8f06e;
      --muted:    #6b6b78;
      --text:     #e8e8ed;
      --serif:    'DM Serif Display', Georgia, serif;
      --mono:     'DM Mono', 'Courier New', monospace;
      --sans:     'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }

    header h1 em {
      font-style: italic;
      color: var(--accent);
    }

    header p {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 0.04em;
    }

    .search-box {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
    }

    .row {
      display: flex;
      gap: 0.5rem;
    }

    input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); }

    button#search-btn {
      background: var(--accent);
      color: #0e0e10;
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.75rem 1.4rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    button#search-btn:hover { opacity: 0.88; }
    button#search-btn:disabled { opacity: 0.4; cursor: default; }

    /* Results list */
    #results {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .result-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .result-item:hover {
      border-color: var(--accent);
      background: #1f1f25;
    }

    .result-item .title {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .result-item .meta {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* Lyrics panel */
    #lyrics-panel {
      display: none;
      width: 100%;
      max-width: 560px;
      margin-top: 0.5rem;
    }

    .lyrics-header {
      margin-bottom: 1.5rem;
    }

    .lyrics-header button {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
      margin-bottom: 1.2rem;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }

    .lyrics-header button:hover { color: var(--accent); }

    .lyrics-header h2 {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .lyrics-header .by {
      font-size: 0.82rem;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 0.35rem;
      letter-spacing: 0.04em;
    }

    .divider {
      width: 2.5rem;
      height: 2px;
      background: var(--accent);
      margin: 1.2rem 0;
    }

    #lyrics-body {
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 2;
      color: #c8c8d0;
      white-space: pre-wrap;
      letter-spacing: 0.01em;
    }

    /* Status / empty states */
    .status {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-align: center;
      padding: 2rem 0;
    }

    .status.error { color: #e06c75; }

    @media (max-width: 480px) {
      .row { flex-direction: column; }
      button#search-btn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>find the <em>words</em></h1>
    <p>powered by lrclib · no key required</p>
  </header>

  <div class="search-box">
    <div class="row">
      <input id="q-track" type="text" placeholder="track title" />
      <input id="q-artist" type="text" placeholder="artist" style="max-width:180px" />
    </div>
    <div class="row">
      <button id="search-btn" onclick="doSearch()">Search</button>
    </div>
  </div>

  <div id="results"></div>
  <div id="lyrics-panel">
    <div class="lyrics-header">
      <button onclick="showResults()">← back to results</button>
      <h2 id="lp-title"></h2>
      <div class="by" id="lp-by"></div>
      <div class="divider"></div>
    </div>
    <div id="lyrics-body"></div>
  </div>

  <script>
    const trackInput  = document.getElementById('q-track');
    const artistInput = document.getElementById('q-artist');
    const resultsEl   = document.getElementById('results');
    const lyricsPanel = document.getElementById('lyrics-panel');
    const searchBtn   = document.getElementById('search-btn');

    let lastResults = [];

    // Allow Enter key on inputs
    [trackInput, artistInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    });

    async function doSearch() {
      const track  = trackInput.value.trim();
      const artist = artistInput.value.trim();
      if (!track && !artist) return;

      searchBtn.disabled = true;
      resultsEl.innerHTML = '<div class="status">searching…</div>';
      lyricsPanel.style.display = 'none';

      try {
        const params = new URLSearchParams();
        if (track)  params.set('track_name', track);
        if (artist) params.set('artist_name', artist);

        const res  = await fetch(`https://lrclib.net/api/search?${params}`);
        const data = await res.json();

        lastResults = data;

        if (!data.length) {
          resultsEl.innerHTML = '<div class="status">no results found — try different terms</div>';
          return;
        }

        renderResults(data);
      } catch (err) {
        resultsEl.innerHTML = '<div class="status error">network error — check your connection</div>';
      } finally {
        searchBtn.disabled = false;
      }
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';
      data.slice(0, 12).forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'result-item';
        el.innerHTML = `
          <span class="title">${esc(item.trackName)}</span>
          <span class="meta">${esc(item.artistName)}${item.albumName ? ' · ' + esc(item.albumName) : ''}</span>
        `;
        el.addEventListener('click', () => showLyrics(item));
        resultsEl.appendChild(el);
      });
    }

    function showLyrics(item) {
      const lyrics = item.plainLyrics || item.syncedLyrics?.replace(/^\[[\d:\.]+\]\s?/gm, '') || null;

      resultsEl.style.display = 'none';
      lyricsPanel.style.display = 'block';

      document.getElementById('lp-title').textContent = item.trackName;
      document.getElementById('lp-by').textContent    = item.artistName + (item.albumName ? ' · ' + item.albumName : '');
      document.getElementById('lyrics-body').textContent = lyrics || '(no lyrics available for this track)';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResults() {
      lyricsPanel.style.display = 'none';
      resultsEl.style.display   = '';
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>

</body>
</html>
