<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Roadtrip // Trip Computer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07080a;
    --dash:#12150f;
    --dash-2:#191d15;
    --line:#2c3327;
    --line-lit:#3d4736;
    --phosphor:#8dffa0;
    --phosphor-dim:#4a8a56;
    --amber:#ffb03c;
    --red:#ff4f3f;
    --paper:#d8c69c;
    --paper-ink:#2a2418;
    --text:#d8e0d2;
    --text-dim:#77816f;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--void);
    color:var(--text);
    font-family:'Share Tech Mono', monospace;
    min-height:100vh;
    padding-bottom:60px;
    -webkit-tap-highlight-color: transparent;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:5; mix-blend-mode:overlay;
  }

  /* ---------- WINDSHIELD SCENE ---------- */
  .windshield{ position:relative; height:128px; overflow:hidden; }
  .sky{ position:absolute; inset:0; transition:background 0.6s; }
  .sky.day{ background:linear-gradient(#7fa8cf 0%, #cbb98a 100%); }
  .sky.night{ background:linear-gradient(#0a0e1c 0%, #1a2236 100%); }
  .orb{ position:absolute; width:26px; height:26px; border-radius:50%; top:18px; right:40px; transition:all 0.6s; }
  .orb.day{ background:#fff2c4; box-shadow:0 0 24px 8px rgba(255,242,196,0.6); }
  .orb.night{ background:#dfe6f2; box-shadow:0 0 16px 4px rgba(223,230,242,0.35); right:auto; left:40px; }
  .stars{ position:absolute; inset:0; opacity:0; transition:opacity 0.6s; }
  .stars.on{ opacity:1; }
  .star{ position:absolute; width:2px; height:2px; background:#dfe6f2; border-radius:50%; }
  .road{
    position:absolute; left:50%; bottom:-10px; width:340px; height:110px; transform:translateX(-50%);
    background:linear-gradient(180deg,#2a2c2e 0%, #1a1b1c 100%);
    clip-path: polygon(42% 0%, 58% 0%, 100% 100%, 0% 100%);
  }
  .road::before{
    content:""; position:absolute; left:50%; top:0; bottom:0; width:6px; transform:translateX(-50%);
    background-image: repeating-linear-gradient(180deg, var(--paper) 0px, var(--paper) 14px, transparent 14px, transparent 28px);
    animation: dashmove 0.5s linear infinite;
    opacity:0.85;
  }
  @keyframes dashmove{ from{ background-position-y:0; } to{ background-position-y:28px; } }
  .horizon-label{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    font-family:'Orbitron', sans-serif; font-size:10px; letter-spacing:0.3em; color:rgba(216,224,210,0.55);
    text-transform:uppercase; z-index:2;
  }

  .wrap{ padding:0 12px; position:relative; z-index:1; max-width:520px; margin:0 auto; }

  /* ---------- DASH PANEL ---------- */
  .dash{
    margin-top:-14px; position:relative; z-index:2;
    background:linear-gradient(180deg, var(--dash) 0%, #0d0f0b 100%);
    border:1px solid var(--line); border-radius:16px 16px 10px 10px;
    padding:14px 12px 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 10px 30px rgba(0,0,0,0.5);
  }
  .brandrow{ display:flex; justify-content:space-between; align-items:center; padding:0 2px 10px; }
  .brand{ font-family:'Orbitron', sans-serif; font-weight:800; font-size:15px; letter-spacing:0.12em; color:var(--phosphor); }
  .brand span{ color:var(--text-dim); font-weight:500; }
  .bestline{ font-family:'Share Tech Mono', monospace; font-size:10px; color:var(--text-dim); text-align:right; }
  .bestline b{ color:var(--amber); }
  .rivet-row{ display:flex; gap:4px; }
  .rivet{ width:5px; height:5px; border-radius:50%; background:var(--line-lit); }

  .gauges{ display:flex; align-items:flex-end; justify-content:space-between; gap:6px; }
  .gauge-wrap{ text-align:center; width:118px; }
  .gauge-label{ font-family:'Orbitron', sans-serif; font-size:10px; letter-spacing:0.15em; color:var(--text-dim); text-transform:uppercase; margin-top:2px; }
  .gauge-value{ font-family:'VT323', monospace; font-size:22px; color:var(--phosphor); line-height:1; margin-top:-4px; }

  .lcd{
    flex:1; background:#0a1008; border:1px solid var(--line-lit); border-radius:8px;
    padding:8px 4px; text-align:center; align-self:center;
    box-shadow: inset 0 0 12px rgba(141,255,160,0.08);
  }
  .lcd-time{ font-family:'VT323', monospace; font-size:32px; color:var(--phosphor); line-height:1; letter-spacing:0.04em; text-shadow:0 0 8px rgba(141,255,160,0.5); }
  .lcd-sub{ font-family:'Orbitron', sans-serif; font-size:9px; color:var(--phosphor-dim); letter-spacing:0.2em; margin-top:2px; }
  .lcd-odo{ font-family:'VT323', monospace; font-size:20px; color:var(--phosphor); margin-top:6px; border-top:1px dashed var(--line-lit); padding-top:6px; }
  .lcd-odo b{ font-size:24px; }

  /* warning lights */
  .warnrow{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:14px; }
  .warn{ text-align:center; }
  .warn .lamp{ width:26px; height:26px; border-radius:50%; margin:0 auto; border:1px solid var(--line); background:#161a12; }
  .warn .lamp.g{ background:radial-gradient(circle, #294a2c 0%, #182317 100%); box-shadow:0 0 6px rgba(141,255,160,0.15); }
  .warn .lamp.a{ background:radial-gradient(circle, var(--amber) 0%, #7a5316 100%); box-shadow:0 0 12px rgba(255,176,60,0.6); }
  .warn .lamp.r{ background:radial-gradient(circle, var(--red) 0%, #6b1710 100%); box-shadow:0 0 14px rgba(255,79,63,0.75); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.55;} }
  .warn .wlabel{ font-family:'Orbitron', sans-serif; font-size:8px; letter-spacing:0.08em; color:var(--text-dim); margin-top:4px; text-transform:uppercase; }

  .terrainline{ margin-top:10px; text-align:center; font-size:11px; color:var(--text-dim); border-top:1px dashed var(--line); padding-top:8px; }
  .terrainline b{ color:var(--phosphor); }

  .paceRow{ display:flex; gap:6px; }
  .paceRow button{ padding:12px 4px; font-size:13px; }
  button.danger{ color:var(--amber); }
  button.danger::before{ background:var(--red); box-shadow:0 0 5px var(--red); }

  .rationRow{ display:flex; gap:6px; }
  .rationbtn{ flex:1; padding:9px 4px; font-size:11px; opacity:0.55; }
  .rationbtn.active{ opacity:1; border-color:var(--phosphor-dim); }
  .rationbtn.active::before{ background:var(--phosphor); box-shadow:0 0 5px var(--phosphor); }

  /* segmented bars used everywhere */
  .segbar{ display:flex; gap:2px; }
  .seg{ flex:1; height:9px; background:#181d14; border:1px solid var(--line); border-radius:1px; }
  .seg.on{ box-shadow:0 0 5px var(--c, var(--phosphor)); background:var(--c, var(--phosphor)); border-color:transparent; }

  /* ---------- SECTIONS ---------- */
  .section{ margin-top:12px; background:linear-gradient(180deg, var(--dash) 0%, #0d0f0b 100%); border:1px solid var(--line); border-radius:12px; padding:12px 12px 10px; }
  .section-label{ font-family:'Orbitron', sans-serif; font-size:10px; color:var(--text-dim); letter-spacing:0.18em; text-transform:uppercase; margin-bottom:10px; display:flex; justify-content:space-between; }
  .section-label b{ color:var(--phosphor); }

  .partline{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .partline .pname{ width:64px; font-size:11px; color:var(--text-dim); flex-shrink:0; }
  .partline .pval{ width:34px; text-align:right; font-family:'VT323', monospace; font-size:16px; color:var(--text); flex-shrink:0; }

  /* crew - CB roster cards */
  .matecard{ background:var(--dash-2); border:1px solid var(--line); border-radius:10px; padding:10px 11px; margin-bottom:8px; position:relative; }
  .matecard::before{ content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; background:var(--phosphor-dim); border-radius:2px; }
  .matecard.dead{ opacity:0.35; }
  .matecard.dead::before{ background:var(--red); }
  .mate-top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px; }
  .mate-name{ font-family:'Orbitron', sans-serif; font-weight:700; font-size:15px; letter-spacing:0.04em; color:var(--text); }
  .tag{ font-family:'Share Tech Mono', monospace; font-size:9px; padding:2px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:0.06em; border:1px solid; }
  .tag.drive{ color:var(--amber); border-color:rgba(255,176,60,0.4); background:rgba(255,176,60,0.08); }
  .tag.sick{ color:#ff9b91; border-color:rgba(255,79,63,0.4); background:rgba(255,79,63,0.08); }
  .tag.injured{ color:#ff6a4d; border-color:rgba(255,106,77,0.55); background:rgba(255,106,77,0.14); }
  .tag.teach{ color:var(--phosphor); border-color:rgba(141,255,160,0.4); background:rgba(141,255,160,0.08); }
  .tag.learn{ color:#8fb8ff; border-color:rgba(143,184,255,0.4); background:rgba(143,184,255,0.08); }
  .microbtn{ font-family:'Orbitron', sans-serif; font-size:9px; padding:3px 8px; border-radius:4px; background:#181d14; color:var(--text-dim); border:1px solid var(--line); cursor:pointer; letter-spacing:0.06em; }
  .microbtn:active{ background:#0d100b; }

  .indicators{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:9px; }
  .indicators3{ grid-template-columns:repeat(3,1fr); }
  .ind .lbl{ font-family:'Orbitron', sans-serif; font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; }
  .sharedfood-row{ display:flex; justify-content:space-between; font-family:'Orbitron', sans-serif; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:5px; }
  .sharedfood-row b{ font-family:'VT323', monospace; font-size:16px; color:var(--phosphor); letter-spacing:0; text-transform:none; }
  .skills{ margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
  .skillchip{ font-size:10px; background:#0f120d; border:1px solid var(--line); border-radius:5px; padding:3px 7px; color:var(--text-dim); }
  .skillchip b{ color:var(--phosphor); }

  /* glovebox manifest / inventory */
  .manifest{ background:var(--paper); border-radius:6px; padding:10px 12px; color:var(--paper-ink); }
  .manifest-title{ font-family:'Orbitron', sans-serif; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; border-bottom:1px dashed rgba(42,36,24,0.35); padding-bottom:6px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .mrow{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; border-bottom:1px dotted rgba(42,36,24,0.2); }
  .mrow b{ font-family:'VT323', monospace; font-size:15px; }

  /* action bar */
  .actionbar{ display:flex; gap:8px; margin-top:12px; }
  button{
    font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:0.04em; font-size:14px;
    background:var(--dash-2); color:var(--phosphor); border:1px solid var(--line-lit); border-radius:8px; padding:13px 10px;
    flex:1; cursor:pointer; text-transform:uppercase; position:relative;
    box-shadow: 0 3px 0 #050604, inset 0 0 10px rgba(141,255,160,0.05);
  }
  button::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--phosphor-dim); display:inline-block; margin-right:7px; box-shadow:0 0 5px var(--phosphor-dim); }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #050604; }
  button.secondary{ color:var(--text); }
  button.secondary::before{ background:var(--line-lit); box-shadow:none; }
  button:disabled{ opacity:0.3; cursor:not-allowed; }

  .menu-actions{ display:flex; flex-direction:column; gap:7px; margin-top:8px; }
  .menu-actions button{ flex:none; width:100%; text-align:left; padding:11px 12px; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
  .menu-actions button small{ font-family:'Share Tech Mono', monospace; font-size:10px; color:var(--text-dim); text-transform:none; letter-spacing:0; margin-left:8px;}

  /* scanner log */
  .scanner{ background:#0a0d08; border:1px solid var(--line); border-radius:8px; padding:8px; max-height:170px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:5px; }
  .scan-entry{ font-size:11px; padding:6px 8px; border-radius:4px; color:var(--text-dim); border-left:2px solid var(--line); }
  .scan-entry.event{ border-left-color:var(--amber); color:var(--amber); }
  .scan-entry.bad{ border-left-color:var(--red); color:#ff9b91; }
  .scan-entry.good{ border-left-color:var(--phosphor); color:var(--phosphor); }
  .scan-caret{ font-family:'VT323', monospace; color:var(--phosphor-dim); font-size:13px; }
  .scan-caret::after{ content:"_"; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:var(--dash); border:1px solid var(--line-lit); border-radius:14px; padding:20px; max-width:420px; width:100%; box-shadow:0 0 40px rgba(0,0,0,0.6); }
  .modal h2{ font-family:'Orbitron', sans-serif; font-size:20px; margin:0 0 8px; color:var(--phosphor); letter-spacing:0.06em; }
  .modal p{ font-size:13px; color:var(--text-dim); line-height:1.5; margin:0 0 14px;}
  .modal .stat{ font-family:'VT323', monospace; font-size:16px; color:var(--text); margin-bottom:4px;}

  select{ width:100%; background:#0a0d08; border:1px solid var(--line-lit); color:var(--text); border-radius:6px; padding:10px; font-family:'Share Tech Mono', monospace; font-size:13px; margin-bottom:8px;}
  label.flabel{ font-family:'Orbitron', sans-serif; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; display:block; margin:8px 0 4px;}

  .hidden{ display:none !important; }
  .footer-note{ text-align:center; font-family:'Share Tech Mono', monospace; font-size:10px; color:var(--text-dim); margin-top:20px; opacity:0.5;}

  /* ---------- DESKTOP LAYOUT ---------- */
  /* Mobile styling above is untouched; this only kicks in on wider viewports. */
  @media (min-width: 900px){
    .windshield{ height:170px; }
    .road{ width:460px; }
    .wrap{
      max-width: 1080px;
      display: grid;
      grid-template-columns: 420px 1fr;
      column-gap: 18px;
      grid-template-areas:
        "dash dash"
        "controls crew"
        "log crew"
        "diag manifest"
        "footer footer";
      align-items: start;
    }
    .dash{ grid-area: dash; }
    #rollingControls{ grid-area: controls; }
    #stopControls{ grid-area: controls; }
    #logSection{ grid-area: log; }
    #crewSection{ grid-area: crew; }
    #diagSection{ grid-area: diag; }
    #rationsSection{ grid-area: manifest; }
    .footer-note{ grid-area: footer; }

    .scanner{ max-height: 320px; }
    .gauges{ justify-content: space-around; }
    .indicators3{ grid-template-columns: repeat(3,1fr); }
    #mateList{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    .inv, .manifest .mrow{ font-size:12px; }
  }
</style>
</head>
<body>

<div class="windshield">
  <div class="sky day" id="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="orb day" id="orb"></div>
  <div class="road"></div>
  <div class="horizon-label" id="horizonLabel">HIGHWAY // UNKNOWN</div>
</div>

<div class="wrap">

  <div class="dash">
    <div class="brandrow">
      <div class="brand">TRIP<span>-COMPUTER</span></div>
      <div class="bestline" id="bestLine"></div>
    </div>

    <div class="gauges">
      <div class="gauge-wrap" id="gaugeFuelWrap"></div>
      <div class="lcd">
        <div class="lcd-time" id="clockMain">D1 · 06:00</div>
        <div class="lcd-sub" id="clockSub">DAYTIME</div>
        <div class="lcd-odo"><b id="distTotal">0</b> KM</div>
      </div>
      <div class="gauge-wrap" id="gaugeCarWrap"></div>
    </div>

    <div class="warnrow" id="warnRow"></div>
    <div class="terrainline" id="terrainLine"></div>
  </div>

  <div id="rollingControls">
    <div class="paceRow">
      <button onclick="driveOneHour('steady')">Steady</button>
      <button onclick="driveOneHour('push')">Push It</button>
      <button class="danger" onclick="driveOneHour('grueling')">Grueling</button>
    </div>
    <div class="actionbar" style="margin-top:8px;">
      <button class="secondary" id="btnCamp">Make Camp</button>
    </div>
  </div>

  <div id="stopControls" class="section hidden">
    <div class="section-label"><span id="stopTitle">Camp</span><span id="stopSub"></span></div>
    <div class="menu-actions" id="stopMenu"></div>
  </div>

  <div class="section" id="logSection">
    <div class="section-label"><span>Scanner Feed</span><span class="scan-caret"></span></div>
    <div class="scanner" id="logBox"></div>
  </div>

  <div class="section" id="diagSection">
    <div class="section-label"><span>Diagnostics</span><b id="carStatus">RUNNING</b></div>
    <div id="partLines"></div>
  </div>

  <div class="section" id="crewSection">
    <div class="section-label"><span>Crew Roster</span><b id="crewCount">4 ALIVE</b></div>
    <div id="sharedFood" style="margin-bottom:10px;"></div>
    <div id="mateList"></div>
    <button class="secondary" style="margin-top:4px;width:100%;" onclick="openTeachPicker()">Assign Teaching / Learning</button>
    <button class="secondary" style="margin-top:6px;width:100%;" onclick="openManualPicker()" id="manualBtn">Read Skill Manual</button>
  </div>

  <div class="section" id="rationsSection">
    <div class="section-label"><span>Rations</span></div>
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">Food always depletes over time — this sets how fast, and what you risk to slow it down.</div>
    <div class="rationRow">
      <button class="rationbtn secondary" data-r="full" onclick="setRation('full')">Full</button>
      <button class="rationbtn secondary" data-r="reduced" onclick="setRation('reduced')">Reduced</button>
      <button class="rationbtn secondary" data-r="bare" onclick="setRation('bare')">Bare Bones</button>
    </div>
    <div class="manifest" id="manifestBox" style="margin-top:10px;"></div>
  </div>

  <div class="footer-note">rough prototype · numbers unbalanced on purpose · playtest &amp; report back</div>
</div>

<div id="modalRoot"></div>

<script>
/* ============================== STATE ============================== */

const PARTS = ['engine','tires','battery','radiator','brakes'];
const PART_LABEL = {engine:'Engine', tires:'Tires', battery:'Battery', radiator:'Radiator', brakes:'Brakes'};
const PART_SHORT = {engine:'ENG', tires:'TIRE', battery:'BATT', radiator:'RAD', brakes:'BRK'};
const SKILLS = ['mechanic','forage','firstaid'];
const SKILL_LABEL = {mechanic:'Mechanic', forage:'Forage', firstaid:'First Aid'};

const NAMES = ['Rui','Nando','Bea','Mica'];

const TERRAINS = {
  plains:    { label:'Plains',    desc:'Flat and unremarkable. Easy driving.',        fuelMult:1.0,  tireMult:1.0, brakeMult:1.0 },
  desert:    { label:'Desert',    desc:'Brutal on fuel, thin on supplies.',           fuelMult:1.35, tireMult:1.1, brakeMult:0.8 },
  mountains: { label:'Mountains', desc:'Hard on tires and brakes both.',              fuelMult:1.1,  tireMult:1.3, brakeMult:1.6 },
  forest:    { label:'Forest',    desc:'Good foraging, more wildlife trouble.',       fuelMult:0.95, tireMult:1.15,brakeMult:1.0 },
  coastal:   { label:'Coastal',   desc:'Civilization nearby. Better prices, more stops.', fuelMult:0.9, tireMult:0.9, brakeMult:1.0 },
};

const PACES = {
  steady:   { label:'Steady',   speedMult:1.0,  fuelMult:1.0, fatigueMult:1.0, eventMult:1.0, wearMin:0, wearMax:0 },
  push:     { label:'Push It',  speedMult:1.25, fuelMult:1.35,fatigueMult:1.5, eventMult:1.15,wearMin:0, wearMax:3 },
  grueling: { label:'Grueling', speedMult:1.45, fuelMult:1.7, fatigueMult:2.2, eventMult:1.3, wearMin:2, wearMax:6 },
};

function rand(min,max){ return Math.random()*(max-min)+min; }
function ri(min,max){ return Math.floor(rand(min,max+1)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickWeighted(list){
  const total = list.reduce((s,i)=>s+i.w,0);
  let r = Math.random()*total;
  for(const item of list){ if((r-=item.w)<=0) return item; }
  return list[list.length-1];
}

function wearPart(part, amount){
  const t = TERRAINS[S.terrain];
  const mult = part==='tires' ? t.tireMult : part==='brakes' ? t.brakeMult : part==='radiator' ? t.fuelMult : 1;
  S.parts[part] = clamp(S.parts[part] - amount*mult, 0, 100);
}
function gainCash(amount){ S.inv.cash = Math.round(S.inv.cash + amount); }
function foodConsumption(){
  const rationMult = {full:1, reduced:0.65, bare:0.4}[S.ration];
  return aliveMates().length * 0.5 * rationMult;
}
function scarcityMult(){
  // the world runs thinner the longer you survive — small compounding pressure against endless runs
  return clamp(1 + (S.day-1)*0.009, 1, 1.45);
}
function maybeRotateTerrain(kmThisHour){
  S.terrainKmLeft -= kmThisHour;
  if(S.terrainKmLeft <= 0){
    S.terrain = S.nextTerrain;
    const keys = Object.keys(TERRAINS).filter(t=>t!==S.terrain);
    S.nextTerrain = pick(keys);
    S.terrainKmLeft = ri(120,220);
    log(`Terrain shifts — entering ${TERRAINS[S.terrain].label}. ${TERRAINS[S.terrain].desc}`,'event');
  }
}

function loadBest(){
  try {
    const raw = localStorage.getItem('roadtrip_best_v1');
    return raw ? JSON.parse(raw) : {distance:0, day:0};
  } catch(e){ return {distance:0, day:0}; }
}
function saveBestIfBetter(distance, day){
  const best = loadBest();
  if(distance > best.distance){
    try { localStorage.setItem('roadtrip_best_v1', JSON.stringify({distance, day})); } catch(e){}
    return true;
  }
  return false;
}

function makeMates(){
  const mates = NAMES.map((n,i)=>({
    id:i, name:n, alive:true, driving:false,
    health:100, food:100, fatigue:0, morale:70, sick:0, injured:0,
    skills:{mechanic:8, forage:8, firstaid:8},
    teaching:null, learning:null
  }));
  SKILLS.forEach((sk,i)=>{ mates[i].skills[sk] = ri(55,80); });
  mates.forEach((m,i)=>{
    const other = SKILLS[(i+1)%SKILLS.length];
    if(m.skills[other] < 40) m.skills[other] += ri(10,25);
  });
  mates[0].driving = true;
  return mates;
}

function makeState(){
  const parts = {};
  PARTS.forEach(p=> parts[p] = 100);
  const terrainKeys = Object.keys(TERRAINS);
  return {
    day:1, hour:6,
    distance:0,
    mates: makeMates(),
    parts,
    fuel: 100,
    inv: { food: 90, spareTire: 1, engineKit: 1, batteryPack: 0, radiatorPart: 0, brakePads: 1, medkit: 1, cash: 60, fuelCan: 0, skillManual: 0, weapon: 0 },
    mode: 'rolling',
    atLocation: null,
    locationVisits: 0,
    ration: 'full',
    terrain: 'plains',
    nextTerrain: pick(terrainKeys.filter(t=>t!=='plains')),
    terrainKmLeft: ri(120,220),
    raidCount: 0,
    log: [],
    gameOver: null
  };
}

let S = makeState();

/* ============================== TIME / DAY-NIGHT ============================== */
function isDay(){ return S.hour >= 6 && S.hour < 22; }
function advanceHour(hours){
  for(let i=0;i<hours;i++){ S.hour++; if(S.hour>=24){ S.hour=0; S.day++; } }
}

/* ============================== HELPERS ============================== */
function log(msg, cls){ S.log.push({msg, cls: cls||''}); if(S.log.length>40) S.log.shift(); }
function aliveMates(){ return S.mates.filter(m=>m.alive); }
function drivingMate(){ return S.mates.find(m=>m.driving && m.alive); }
function bestForSkill(skill, excludeDriving){
  return aliveMates().filter(m=> !excludeDriving || !m.driving).sort((a,b)=> b.skills[skill]-a.skills[skill])[0];
}
function skillCheck(mate, skill){
  if(!mate) return false;
  const lvl = mate.skills[skill];
  const chance = clamp(lvl/100, 0.05, 0.97);
  return Math.random() < chance;
}

/* ============================== EVENTS ============================== */
function grantRandomPart(){
  const itemMap = {spareTire:'a spare tire', engineKit:'an engine kit', batteryPack:'a battery', radiatorPart:'a radiator part', brakePads:'brake pads'};
  const keys = Object.keys(itemMap);
  const key = pick(keys);
  S.inv[key]++;
  return itemMap[key];
}

function grantFuelCan(size){
  S.inv.fuelCan++;
  const base = size || ri(18,26);
  return Math.max(6, Math.round(base / scarcityMult()));
}

// weighted scavenge outcome table, shaped by what location you're at.
// decayMult shrinks numeric gains, visits inflates the "nothing" odds — both only apply to anchored locations (rest/ruins/garage), not roadside.
function scavengeLoot(mate, locationType, decayMult, visits){
  decayMult = decayMult===undefined ? 1 : decayMult;
  visits = visits || 0;
  const terrainFoodMult = S.terrain==='forest'?1.4 : S.terrain==='desert'?0.6 : 1;
  const tables = {
    roadside: [
      {w:44, fn:(dm)=>{ const g=Math.round(ri(8,8+Math.round(mate.skills.forage/4))*terrainFoodMult*dm); S.inv.food+=g; return `+${g} food`; }},
      {w:14, fn:(dm)=>{ const g=Math.round(ri(4,14)*dm); gainCash(g); return `+$${g} cash`; }},
      {w:10, fn:()=>{ const size=grantFuelCan(); return `found a fuel can (~${size}%, stored)`; }},
      {w:10, fn:()=>{ const got=grantRandomPart(); return `salvaged ${got}`; }},
      {w:4, fn:()=>{ S.inv.medkit++; return `found a medkit`; }},
      {w:4, fn:()=>{ S.inv.skillManual++; return `found a tattered skill manual`; }},
      {w:14, nothing:true, fn:()=>{ return `nothing worth carrying`; }},
    ],
    rest: [
      {w:32, fn:(dm)=>{ const g=Math.round(ri(10,20)*terrainFoodMult*dm); S.inv.food+=g; return `+${g} food from a dead vending machine`; }},
      {w:16, fn:(dm)=>{ const g=Math.round(ri(6,16)*dm); gainCash(g); return `+$${g} in loose change`; }},
      {w:14, fn:()=>{ S.inv.medkit++; return `found a first-aid kit in a bathroom cabinet`; }},
      {w:8, fn:()=>{ const size=grantFuelCan(); return `siphoned a can from a car left in the lot, ~${size}%`; }},
      {w:6, fn:()=>{ const got=grantRandomPart(); return `found ${got} in a maintenance closet`; }},
      {w:4, fn:()=>{ S.inv.skillManual++; return `found a dog-eared manual left on a bench`; }},
      {w:20, nothing:true, fn:()=>{ return `picked clean already, nothing left`; }},
    ],
    ruins: [
      {w:20, fn:()=>{ const got=grantRandomPart(); return `salvaged ${got} from a stripped car`; }},
      {w:14, fn:(dm)=>{ const g=Math.round(ri(6,16)*terrainFoodMult*dm); S.inv.food+=g; return `+${g} food from a sealed pantry`; }},
      {w:12, fn:()=>{ S.inv.medkit++; return `found a medkit in a collapsed cabinet`; }},
      {w:11, fn:()=>{ const size=grantFuelCan(); return `drained a can from a dead generator, ~${size}%`; }},
      {w:9, fn:()=>{ S.inv.skillManual++; return `found a water-damaged skill manual`; }},
      {w:9, fn:(dm)=>{ const g=Math.round(ri(10,24)*dm); gainCash(g); return `+$${g} from a stripped register`; }},
      {w:7, fn:()=>{ S.inv.weapon++; return `found something to defend the car with`; }},
      {w:18, nothing:true, fn:()=>{ return `nothing but dust and rot`; }},
    ],
    garage: [
      {w:28, fn:()=>{ const got=grantRandomPart(); return `found ${got} in the back lot, unattended`; }},
      {w:9, fn:()=>{ const size=grantFuelCan(); return `siphoned a can from a junker out back, ~${size}%`; }},
      {w:7, fn:()=>{ S.inv.skillManual++; return `found a service manual on a shelf`; }},
      {w:9, fn:(dm)=>{ const g=Math.round(ri(5,15)*dm); gainCash(g); return `+$${g} from a loose till`; }},
      {w:5, fn:()=>{ S.inv.weapon++; return `found a tire iron worth keeping handy`; }},
      {w:42, nothing:true, fn:()=>{ return `nothing free lying around — the good stuff's behind the counter`; }},
    ],
  };
  const baseTable = tables[locationType] || tables.roadside;
  const isAnchored = locationType!=='roadside' && !!tables[locationType];
  const table = isAnchored
    ? baseTable.map(e => e.nothing ? { ...e, w: e.w + visits*7 } : e)
    : baseTable;
  const picked = pickWeighted(table);
  return picked.fn(decayMult);
}

function rollEvent(eventMult){

}

/* ============================== CORE TICK ============================== */
function driveOneHour(pace){
  pace = pace || 'steady';
  if(S.mode==='gameover') return;
  const driver = drivingMate();
  if(!driver){ checkGameOver(); return; }
  const P = PACES[pace];

  const soloDriver = aliveMates().length===1;

  let speedMod = 1;
  if(soloDriver){
    if(driver.fatigue > 50) speedMod *= 0.5;
    else if(driver.fatigue > 25) speedMod *= 0.8;
  } else {
    if(driver.fatigue > 70) speedMod *= 0.6;
    else if(driver.fatigue > 40) speedMod *= 0.85;
  }
  if(driver.teaching) speedMod *= 0.5;
  if(S.parts.brakes < 30) speedMod *= 0.7;
  if(isDay() && S.parts.radiator < 25) speedMod *= 0.75;
  speedMod *= P.speedMult;

  const baseSpeed = 55;
  const kmThisHour = Math.round(baseSpeed * speedMod);
  S.distance += kmThisHour;
  maybeRotateTerrain(kmThisHour);

  S.fuel = clamp(S.fuel - rand(2,3.5) * P.fuelMult * TERRAINS[S.terrain].fuelMult * scarcityMult(), 0, 100);
  S.inv.food = Math.max(0, S.inv.food - foodConsumption());
  driver.fatigue = clamp(driver.fatigue + (soloDriver ? ri(4,8) : ri(2,5)) * P.fatigueMult, 0, 100);
  aliveMates().forEach(m=>{ if(!m.driving) m.fatigue = clamp(m.fatigue-1,0,100); });

  if(P.wearMax > 0){
    const stressPart = pick(['tires','brakes','engine']);
    wearPart(stressPart, ri(P.wearMin, P.wearMax));
  }

  if(S.inv.food<=0){
    aliveMates().forEach(m=>{
      const rate = 2 + Math.round((1-m.skills.firstaid/200)*2);
      m.health = clamp(m.health-rate,0,100);
    });
    log(`No food left. The crew is starving.`,'bad');
  } else if(S.ration==='bare' && Math.random()<0.12){
    const m = pick(aliveMates()); m.health = clamp(m.health-1,0,100);
    log(`Bare rations are catching up with ${m.name}.`,'bad');
  } else if(S.ration==='reduced' && Math.random()<0.06){
    const m = pick(aliveMates()); m.morale = clamp(m.morale-1,0,100);
  }

  aliveMates().forEach(m=>{
    if(m.sick > 0){
      m.health = clamp(m.health - ri(1,3), 0, 100);
      m.sick--;
      if(m.sick<=0) log(`${m.name} has recovered.`,'good');
    }
    if(m.injured > 0){
      m.health = clamp(m.health - ri(2,6), 0, 100);
      if(Math.random() < 0.05){
        const dmg = ri(15,32);
        m.health = clamp(m.health-dmg,0,100);
        log(`${m.name}'s injury takes a bad turn.`,'bad');
      }
      m.injured--;
      if(m.injured<=0) log(`${m.name}'s injury has healed up.`,'good');
    }
  });

  applyTeaching(1);
  aliveMates().forEach(m=>{ if(m.health<30) m.morale = clamp(m.morale-1,0,100); });

  checkMateDeaths();

  advanceHour(1);
  rollEvent(P.eventMult);
  checkGameOver();
  render();
}

function checkMateDeaths(){
  aliveMates().forEach(m=>{
    if(m.health<=0 && m.alive){
      m.alive = false;
      log(`${m.name} didn't make it.`,'bad');
      if(m.driving){ const next = aliveMates()[0]; if(next) next.driving = true; }
    }
  });
}

function applyTeaching(hours){
  aliveMates().forEach(teacher=>{
    if(teacher.teaching){
      const student = S.mates.find(m=>m.id===teacher.teaching.studentId && m.alive);
      const skill = teacher.teaching.skill;
      if(!student){ teacher.teaching=null; return; }
      const rate = 2 * hours;
      const cap = teacher.skills[skill];
      student.skills[skill] = clamp(student.skills[skill] + rate, 0, cap);
      if(student.skills[skill] >= cap){
        log(`${student.name} has learned all ${SKILL_LABEL[skill]} ${teacher.name} can teach.`,'good');
        teacher.teaching = null;
        student.learning = null;
      }
    }
  });
}

/* ============================== GAME OVER CHECKS ============================== */
function checkGameOver(){
  if(S.fuel<=0 && S.inv.fuelCan>0){
    S.inv.fuelCan--;
    S.fuel = Math.max(6, Math.round(ri(18,26) / scarcityMult()));
    log(`Tank ran dry — poured in a spare can just in time.`,'good');
  }
  let reason = null;
  if(S.parts.tires<=0 && S.inv.spareTire<=0) reason = 'Tire blew and there was no spare left.';
  else if(S.parts.engine<=0 && S.inv.engineKit<=0) reason = 'The engine seized for good, no parts left to fix it.';
  else if(S.fuel<=0) reason = 'Ran bone dry, no fuel left anywhere in reach.';
  else if(aliveMates().length===0) reason = 'The whole crew is gone.';
  if(reason){ S.mode='gameover'; S.gameOver = reason; }
}

/* ============================== CAMP / STOP ACTIONS ============================== */
function enterCamp(){ S.mode = 'stopped'; render(); }
function leaveCamp(){ S.mode = 'rolling'; S.atLocation = null; S.locationVisits = 0; render(); }

// staying put isn't safe — a parked car is a target too, just a different flavor of risk than driving
const CAMP_EVENTS = [
  {w:5, run:(night)=>{ triggerRaiderEvent(night); }},
  {w:6, run:()=>{ const loss = Math.min(S.inv.food, ri(5,15)); S.inv.food -= loss; log(`Something gets into the supplies while you're distracted. -${loss} food.`,'bad'); }},
  {w:4, run:()=>{ const loss = Math.min(S.inv.cash, ri(5,20)); S.inv.cash -= loss; log(`Someone's light-fingered while you're not looking. -$${loss}.`,'bad'); }},
  {w:3, run:()=>{ const m = pick(aliveMates()); m.morale = clamp(m.morale-ri(2,6),0,100); log(`Sitting still this long is wearing on ${m.name}.`,'bad'); }},
  {w:5, run:()=>{ /* quiet, nothing happens */ }},
  {w:3, run:()=>{ const g = ri(4,12); gainCash(g); log(`A passing traveler trades a little cash for conversation. +$${g}.`,'good'); }},
];

function campRiskMult(){
  return { garage:0.5, rest:1, ruins:1.3 }[S.atLocation] ?? 1.2;
}

function rollCampRisk(hours){
  const chance = 0.10 * campRiskMult();
  for(let i=0;i<hours;i++){
    if(Math.random() < chance){
      pickWeighted(CAMP_EVENTS).run(!isDay());
    }
  }
  checkMateDeaths();
  checkGameOver();
}

function actScavenge(){
  const locType = S.atLocation || 'roadside';
  const isAnchored = !!S.atLocation;
  const visits = isAnchored ? S.locationVisits : 0;
  const decayMult = isAnchored ? Math.max(0.15, 1 - visits*0.35) : 1;
  const m = bestForSkill('forage', true) || bestForSkill('forage', false);
  const hours = locType==='ruins' ? ri(1,2) : 1;
  advanceHour(hours);
  S.inv.food = Math.max(0,S.inv.food-foodConsumption()*hours);

  if(locType==='ruins' && Math.random()<0.12){
    const hurt = pick(aliveMates());
    hurt.health = clamp(hurt.health-ri(5,14),0,100);
    log(`A floor gives way while searching the ruins. ${hurt.name} gets banged up.`,'bad');
    if(isAnchored) S.locationVisits++;
    rollCampRisk(hours);
    render(); return;
  }

  const r1 = scavengeLoot(m, locType, decayMult, visits);
  const wantsSecond = locType==='ruins' || (locType==='garage' && Math.random()<0.3);
  const r2 = (wantsSecond && Math.random()<0.5) ? scavengeLoot(m, locType, decayMult, visits) : null;
  m.morale = clamp(m.morale+3,0,100);
  const siteLabel = {roadside:'the roadside', rest:'the rest area', ruins:'the ruins', garage:"the garage's back lot"}[locType];
  const staleNote = isAnchored && visits>=2 ? ' — slim pickings by now' : '';
  log(`${m.name} scavenges ${siteLabel}${staleNote} — ${r1}${r2?`, and ${r2}`:''}.`,'good');
  if(isAnchored) S.locationVisits++;
  rollCampRisk(hours);
  render();
}

function actUseFuelCan(){

}

function actRepair(part){
  const itemKey = {engine:'engineKit', tires:'spareTire', battery:'batteryPack', radiator:'radiatorPart', brakes:'brakePads'}[part];
  if(S.inv[itemKey] <= 0){ log(`No parts on hand to repair the ${PART_LABEL[part]}.`,'bad'); return; }
  const m = bestForSkill('mechanic', true) || bestForSkill('mechanic', false);
  const ok = skillCheck(m,'mechanic');
  advanceHour(1);
  S.inv.food = Math.max(0,S.inv.food-foodConsumption());
  S.inv[itemKey]--;
  if(ok){ S.parts[part] = clamp(S.parts[part] + ri(55,85), 0, 100); log(`${m.name} gets the ${PART_LABEL[part]} properly sorted.`,'good'); }
  else { S.parts[part] = clamp(S.parts[part] + ri(15,30), 0, 100); log(`${m.name} struggles with the ${PART_LABEL[part]}, only a partial fix.`,'bad'); }
  rollCampRisk(1);
  render();
}

function actFieldPatch(){
  const part = PARTS.slice().sort((a,b)=>S.parts[a]-S.parts[b])[0];
  const m = bestForSkill('mechanic', true) || bestForSkill('mechanic', false);
  const ok = skillCheck(m,'mechanic');
  advanceHour(1);
  S.inv.food = Math.max(0,S.inv.food-foodConsumption());
  if(ok){ S.parts[part] = clamp(S.parts[part]+ri(12,26),0,100); log(`${m.name} jury-rigs a quick fix on the ${PART_LABEL[part]}. No parts used, might not hold.`,'good'); }
  else { S.parts[part] = clamp(S.parts[part]-ri(2,9),0,100); log(`${m.name}'s quick fix on the ${PART_LABEL[part]} backfires, makes it worse.`,'bad'); }
  rollCampRisk(1);
  render();
}

function actRest(){
  advanceHour(2);
  S.inv.food = Math.max(0, S.inv.food-foodConsumption()*2);
  aliveMates().forEach(m=>{ m.fatigue = clamp(m.fatigue-40,0,100); if(m.sick>0) m.sick = Math.max(0,m.sick-3); if(m.injured>0) m.injured = Math.max(0,m.injured-3); });
  if(Math.random()<0.15){
    S.parts.battery = clamp(S.parts.battery-ri(10,25),0,100);
    log(`Someone didn't shut a door properly. Battery's drained a bit.`,'bad');
  } else { log(`The crew rests. Fatigue eases.`,'good'); }
  rollCampRisk(2);
  render();
}

function actMedkit(){
  if(S.inv.medkit<=0){ log(`No medkits left.`,'bad'); return; }
  const m = aliveMates().sort((a,b)=>a.health-b.health)[0];
  S.inv.medkit--;
  m.health = clamp(m.health+ri(35,55),0,100);
  if(m.sick>0 || m.injured>0){ m.sick=0; m.injured=0; log(`${m.name} patched up — sickness and injuries cleared.`,'good'); }
  else log(`${m.name} patched up with the medkit.`,'good');

}

function actFeedHeal(){
  if(S.inv.food < 15){ log(`Not enough food spare to eat for recovery.`,'bad'); return; }
  const m = aliveMates().sort((a,b)=>a.health-b.health)[0];
  S.inv.food -= 15;

  if(what==='fuel'){
    const need = 100-S.fuel;
    const cost = Math.round(need*prices.fuel);

    if(S.inv.cash < cost){ log(`Can't afford it.`,'bad'); return; }
    S.inv.cash -= cost; S.inv[what]++;
    log(`Bought a ${what} at the garage for $${cost}, robbery but necessary.`,'bad');

}

/* ============================== GAUGE / SEGBAR RENDERING ============================== */
function polarToCartesian(cx,cy,r,angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start = polarToCartesian(cx,cy,r,startAngle);
  const end = polarToCartesian(cx,cy,r,endAngle);
  const largeArc = (endAngle-startAngle) > 180 ? 1 : 0;
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y}`;
}
function valToAngle(v){ return -90 + (clamp(v,0,100)/100)*180; }

function colorFor(v){ return v>60 ? 'var(--phosphor)' : v>30 ? 'var(--amber)' : 'var(--red)'; }

function gaugeSVG(value, label){
  const cx=59, cy=58, r=46;
  const a1 = -90, a2 = valToAngle(30), a3 = valToAngle(60), a4 = 90;
  const needleAngle = valToAngle(value);
  return `
  <svg width="118" height="72" viewBox="0 0 118 72">
    <path d="${describeArc(cx,cy,r,a1,a3<a1?a1:a3)}" stroke="#3a1613" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="${describeArc(cx,cy,r,-90,valToAngle(30))}" stroke="#ff4f3f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="${describeArc(cx,cy,r,valToAngle(30),valToAngle(60))}" stroke="#ffb03c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="${describeArc(cx,cy,r,valToAngle(60),90)}" stroke="#8dffa0" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
    <g transform="rotate(${needleAngle} ${cx} ${cy})">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-38}" stroke="#eef5ea" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#eef5ea" stroke="#0a0d08" stroke-width="1.5"/>
  </svg>
  <div class="gauge-value">${Math.round(value)}</div>
  <div class="gauge-label">${label}</div>
  `;
}

function segBar(value, size){
  size = size || 10;
  let html = '<div class="segbar">';
  const c = colorFor(value);
  const filled = Math.round((value/100)*size);
  for(let i=0;i<size;i++){
    html += `<i class="seg ${i<filled?'on':''}" style="--c:${c}"></i>`;
  }
  html += '</div>';
  return html;
}

function lampClass(value){ return value>60?'g':value>30?'a':'r'; }

        <div class="mate-top">
          <div class="mate-name">${m.name} ${m.alive?'':'✝'}</div>
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">${tags.join('')}${switchBtn}${stopTeachBtn}</div>
        </div>
        <div class="indicators indicators3">
          <div class="ind"><div class="lbl">Health</div>${segBar(m.health,8)}</div>
          <div class="ind"><div class="lbl">Fatigue</div>${segBar(100-m.fatigue,8)}</div>
          <div class="ind"><div class="lbl">Morale</div>${segBar(m.morale,8)}</div>
        </div>
        <div class="skills">${skillChips}</div>
      </div>
    `;
  }).join('');
  document.getElementById('crewCount').textContent = `${aliveMates().length} ALIVE`;

  const invItems = [
    ['food','FOOD (SHARED)'],['cash','CASH'],['fuelCan','FUEL CANS'],['skillManual','SKILL MANUALS'],['weapon','WEAPONS'],['spareTire','SPARE TIRES'],
    ['engineKit','ENGINE KITS'],['batteryPack','BATTERY PACKS'],['radiatorPart','RADIATOR PARTS'],
    ['brakePads','BRAKE PADS'],['medkit','MEDKITS']
  ];
  document.getElementById('manifestBox').innerHTML = `
    <div class="manifest-title"><span>Glovebox Manifest</span><span>#${String(S.day).padStart(3,'0')}</span></div>
    ${invItems.map(([k,l])=>`<div class="mrow"><span>${l}</span><b>${k==='cash'?'$':''}${Math.round(S.inv[k])}</b></div>`).join('')}
  `;

  document.querySelectorAll('.rationbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.r === S.ration);
  });

  document.getElementById('logBox').innerHTML = S.log.slice(-20).map(e=>`<div class="scan-entry ${e.cls}">${e.msg}</div>`).join('');

  const rolling = document.getElementById('rollingControls');
  const stopped = document.getElementById('stopControls');
  if(S.mode==='rolling'){
    rolling.classList.remove('hidden');
    stopped.classList.add('hidden');
    document.getElementById('btnCamp').textContent = S.atLocation==='garage' ? 'Stop At Garage' : (S.atLocation==='rest' ? 'Stop At Rest Area' : (S.atLocation==='ruins' ? 'Stop At Ruins' : 'Make Camp'));
  } else if(S.mode==='stopped'){
    rolling.classList.add('hidden');
    stopped.classList.remove('hidden');
    renderStopMenu();
  }

  if(S.mode==='gameover'){ showGameOver(); }
}

function renderStopMenu(){
  const title = S.atLocation==='garage' ? 'Garage' : (S.atLocation==='rest' ? 'Rest Area' : (S.atLocation==='ruins' ? 'Ruins' : 'Camp'));
  document.getElementById('stopTitle').textContent = title;
  document.getElementById('stopSub').textContent = `D${S.day} · ${String(S.hour).padStart(2,'0')}:00`;

  let html = '';
  const scavSub = {roadside:'Best mate searches nearby — 1hr', rest:'Pick through the rest stop — 1hr', ruins:'Bigger search, minor risk — 1-2hr', garage:'Check the unattended lot — 1hr'}[S.atLocation||'roadside'];
  html += actBtn('actScavenge()','Scavenge', scavSub, 'secondary');
  html += actBtn('actFieldPatch()','Field Patch Weakest Part','Free & quick, risk of backfire — 1hr','secondary');
  PARTS.forEach(p=>{ html += actBtn(`actRepair('${p}')`, `Full Repair: ${PART_LABEL[p]}`, `Uses a spare part + mechanic skill — 1hr`, 'secondary'); });
  html += actBtn('actUseFuelCan()','Pour Fuel Can Into Tank', `${S.inv.fuelCan} can(s) on hand`,'secondary');
  html += actBtn('actRest()','Rest / Sleep','Restores fatigue for the crew — 2hrs, costs food','secondary');
  html += actBtn('actMedkit()','Use Medkit','Instantly heals worst-off mate — item','secondary');
  html += actBtn('actFeedHeal()','Eat To Recover','Trade 15 food for slow health gain','secondary');

  if(S.atLocation==='garage'){
    html += actBtn(`actGarageBuy('fuel')`,'Fill Fuel Tank', 'Criminally priced, but full','secondary');
    html += actBtn(`actGarageBuy('spareTire')`,'Buy Spare Tire','$45','secondary');
    html += actBtn(`actGarageBuy('engineKit')`,'Buy Engine Kit','$60','secondary');
    html += actBtn(`actGarageBuy('batteryPack')`,'Buy Battery','$35','secondary');
    html += actBtn(`actGarageBuy('radiatorPart')`,'Buy Radiator Part','$30','secondary');
    html += actBtn(`actGarageBuy('brakePads')`,'Buy Brake Pads','$25','secondary');
    html += actBtn('openSellPicker()','Sell Spare Parts','Half price, but cash now','secondary');
  }

  html += actBtn('leaveCamp()','Back On The Road','Leave and keep driving','');
  document.getElementById('stopMenu').innerHTML = html;
}

function actBtn(fn,label,sub,cls){
  return `<button class="${cls}" onclick="${fn}"><span>${label}</span><small>${sub}</small></button>`;
}

/* ============================== WIRE UP ============================== */
document.getElementById('btnCamp').onclick = enterCamp;

render();
</script>
</body>
</html>
