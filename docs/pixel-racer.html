<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #140f1f;
    --panel: #1f1730;
    --panel-border: #4a3a6b;
    --accent: #ff2e7e;
    --accent2: #2ee6ff;
    --accent3: #ffd23f;
    --text: #e8e0ff;
    --text-dim: #9a8fc4;
    --grass: #1f3a1a;
    --asphalt: #2b2b33;
    --pixel: 'Press Start 2P', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen { width: 100%; max-width: 960px; padding: 16px; }
  .hidden { display: none !important; }

  h1.title {
    font-family: var(--pixel);
    font-size: 22px;
    color: var(--accent3);
    text-shadow: 3px 3px 0 var(--accent);
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .subtitle { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 20px; }

  /* ── GARAGE ── */
  .garage-layout { display: flex; gap: 20px; flex-wrap: wrap; }
  .garage-left { flex: 1; min-width: 280px; }
  .garage-right { width: 260px; }

  .preview-card {
    background: var(--panel);
    border: 3px solid var(--panel-border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #preview-canvas { image-rendering: pixelated; background: #0a0812; border-radius: 4px; }

  .swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.active { border-color: var(--accent2); }

  .stat-bars { width: 100%; margin-top: 6px; }
  .stat-row { margin-bottom: 8px; }
  .stat-label {
    font-family: var(--pixel); font-size: 9px; color: var(--text-dim);
    display: flex; justify-content: space-between; margin-bottom: 3px;
  }
  .stat-track { background: #0a0812; border-radius: 3px; height: 10px; overflow: hidden; border: 1px solid var(--panel-border); }
  .stat-fill { height: 100%; transition: width 0.2s; }
  .stat-fill.speed { background: var(--accent2); }
  .stat-fill.accel { background: var(--accent3); }
  .stat-fill.handling { background: var(--accent); }

  .part-card {
    background: var(--panel);
    border: 3px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .part-card h3 { font-family: var(--pixel); font-size: 11px; color: var(--accent2); margin-bottom: 10px; }
  .part-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .part-opt {
    flex: 1; min-width: 130px;
    background: #0a0812;
    border: 2px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .part-opt:hover { border-color: var(--accent2); }
  .part-opt.active { border-color: var(--accent); background: rgba(255,46,126,0.12); }
  .part-opt .opt-name { font-weight: 600; margin-bottom: 3px; }
  .part-opt .opt-delta { color: var(--text-dim); font-size: 10px; }

  .btn {
    font-family: var(--pixel);
    font-size: 12px;
    background: var(--accent);
    color: #140f1f;
    border: none;
    border-radius: 6px;
    padding: 14px 18px;
    cursor: pointer;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 0 #a01c53;
    transition: transform 0.05s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a01c53; }
  .btn.secondary { background: var(--accent2); box-shadow: 0 4px 0 #1a8ea3; }
  .btn.secondary:active { box-shadow: 0 1px 0 #1a8ea3; }

  /* ── RACE ── */
  #race-canvas { display: block; margin: 0 auto; image-rendering: pixelated; border-radius: 6px; }
  .race-wrap { position: relative; }
  .hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    font-family: var(--pixel); font-size: 12px; color: var(--text3, var(--accent3));
    pointer-events: none;
    text-shadow: 2px 2px 0 #000;
  }
  .hud span.lap { color: var(--accent3); }
  .hud span.time { color: var(--accent2); }

  .countdown-num {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: var(--pixel); font-size: 64px; color: var(--accent3);
    text-shadow: 4px 4px 0 var(--accent);
  }

  .touch-controls {
    display: none;
    justify-content: space-between;
    margin-top: 10px;
  }
  .touch-controls .side { display: flex; gap: 10px; }
  .touch-btn {
    width: 64px; height: 64px;
    background: var(--panel);
    border: 3px solid var(--panel-border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--pixel);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; touch-action: none;
  }
  .touch-btn:active { background: var(--accent); }
  @media (hover: none) and (pointer: coarse) { .touch-controls { display: flex; } }

  /* ── RESULTS ── */
  .results-card {
    background: var(--panel);
    border: 3px solid var(--panel-border);
    border-radius: 8px;
    padding: 26px;
    text-align: center;
    max-width: 420px;
    margin: 0 auto;
  }
  .results-headline { font-family: var(--pixel); font-size: 18px; margin-bottom: 16px; }
  .results-headline.win { color: var(--accent3); text-shadow: 3px 3px 0 var(--accent); }
  .results-headline.lose { color: var(--text-dim); }
  .results-stat { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .results-stat b { color: var(--text); }
  .results-actions { display: flex; gap: 10px; margin-top: 18px; }
</style>
</head>
<body>

<!-- ═══════════════ GARAGE ═══════════════ -->
<div class="screen" id="screen-garage">
  <h1 class="title">PIXEL RACER</h1>
  <div class="subtitle">Tune your ride, then take on the rival — 3 laps.</div>

  <div class="garage-layout">
    <div class="garage-left">

      <div class="part-card">
        <h3>ENGINE</h3>
        <div class="part-options" id="opts-engine"></div>
      </div>

      <div class="part-card">
        <h3>TIRES</h3>
        <div class="part-options" id="opts-tires"></div>
      </div>

      <div class="part-card">
        <h3>WEIGHT</h3>
        <div class="part-options" id="opts-weight"></div>
      </div>

    </div>

    <div class="garage-right">
      <div class="preview-card">
        <canvas id="preview-canvas" width="120" height="160"></canvas>
        <div class="swatches" id="color-swatches"></div>

        <div class="stat-bars">
          <div class="stat-row">
            <div class="stat-label"><span>TOP SPEED</span></div>
            <div class="stat-track"><div class="stat-fill speed" id="bar-speed"></div></div>
          </div>
          <div class="stat-row">
            <div class="stat-label"><span>ACCEL</span></div>
            <div class="stat-track"><div class="stat-fill accel" id="bar-accel"></div></div>
          </div>
          <div class="stat-row">
            <div class="stat-label"><span>HANDLING</span></div>
            <div class="stat-track"><div class="stat-fill handling" id="bar-handling"></div></div>
          </div>
        </div>

        <button class="btn" onclick="startRace()">RACE ▸</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ RACE ═══════════════ -->
<div class="screen hidden" id="screen-race">
  <div class="race-wrap">
    <canvas id="race-canvas" width="900" height="560"></canvas>
    <div class="hud">
      <span class="lap" id="hud-lap">LAP 1/3</span>
      <span class="time" id="hud-time">00:00.0</span>
    </div>
    <div class="countdown-num hidden" id="countdown"></div>
  </div>
  <div class="touch-controls">
    <div class="side">
      <div class="touch-btn" id="tb-left">◀</div>
      <div class="touch-btn" id="tb-right">▶</div>
    </div>
    <div class="side">
      <div class="touch-btn" id="tb-brake">▼</div>
      <div class="touch-btn" id="tb-gas">▲</div>
    </div>
  </div>
</div>

<!-- ═══════════════ RESULTS ═══════════════ -->
<div class="screen hidden" id="screen-results">
  <div class="results-card">
    <div class="results-headline" id="results-headline">—</div>
    <div class="results-stat">Your time: <b id="results-time">—</b></div>
    <div class="results-stat">Rival time: <b id="results-rival-time">—</b></div>
    <div class="results-actions">
      <button class="btn secondary" onclick="showGarage()">BACK TO GARAGE</button>
      <button class="btn" onclick="startRace()">RACE AGAIN</button>
    </div>
  </div>
</div>

<script>
// ─── PARTS DATA ──────────────────────────────────────────────────────────
const partsData = {
  engine: [
    { name: 'Stock I4', desc: '+0 spd / +0 acc', topSpeed: 0, accel: 0 },
    { name: 'Turbo I4', desc: '+50 spd / +35 acc', topSpeed: 50, accel: 35 },
    { name: 'Twin-Turbo V6', desc: '+90 spd / +55 acc', topSpeed: 90, accel: 55 }
  ],
  tires: [
    { name: 'Street', desc: '+0 hdl / +0 grip', handling: 0, grip: 0 },
    { name: 'Sport', desc: '+0.5 hdl / +grip', handling: 0.5, grip: 0.15 },
    { name: 'Slick', desc: '+0.9 hdl / ++grip', handling: 0.9, grip: 0.3 }
  ],
  weight: [
    { name: 'Stock', desc: 'balanced', accel: 0, handling: 0, stability: 0 },
    { name: 'Stripped Interior', desc: '+acc / +hdl / -stability', accel: 20, handling: 0.3, stability: -0.15 },
    { name: 'Race-Spec Shell', desc: '++acc / ++hdl / --stability', accel: 35, handling: 0.5, stability: -0.3 }
  ]
};
const BASE = { topSpeed: 200, accel: 130, handling: 2.0, grip: 0, stability: 0 };
const MAX = { topSpeed: BASE.topSpeed + 90, accel: BASE.accel + 90, handling: BASE.handling + 1.8 };

let selected = { engine: 0, tires: 0, weight: 0 };
let carColor = '#ff2e7e';
const swatchColors = ['#ff2e7e', '#2ee6ff', '#ffd23f', '#3dff6e', '#ff6a3d', '#b073ff'];

function computeStats() {
  const e = partsData.engine[selected.engine];
  const t = partsData.tires[selected.tires];
  const w = partsData.weight[selected.weight];
  return {
    topSpeed: BASE.topSpeed + e.topSpeed,
    accel: BASE.accel + e.accel + w.accel,
    handling: BASE.handling + t.handling + w.handling,
    grip: BASE.grip + t.grip,
    stability: BASE.stability + w.stability
  };
}

// ─── PIXEL CAR SPRITE ────────────────────────────────────────────────────
// Simple 6x10 grid, nose pointing "up" in sprite-local space.
// . transparent | K outline | B body (dynamic color) | W windshield | H headlight | T tire
const carSprite = [
  '.KKKK.',
  'KHKKHK',
  'KBBBBK',
  'KBWWBK',
  'KBBBBK',
  'TBBBBT',
  'KBBBBK',
  'KBBBBK',
  'TKKKKT',
  '.KKKK.'
];
function drawPixelCar(ctx, x, y, angle, bodyColor, px) {
  const cols = 6, rows = 10;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI / 2); // sprite nose-up -> align with facing angle
  const w = cols * px, h = rows * px;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = carSprite[r][c];
      if (ch === '.') continue;
      let color;
      if (ch === 'K') color = '#0d0d12';
      else if (ch === 'H') color = '#ffe98a';
      else if (ch === 'W') color = '#1a2a3a';
      else if (ch === 'T') color = '#0a0a0a';
      else color = bodyColor;
      ctx.fillStyle = color;
      ctx.fillRect(c * px - w / 2, r * px - h / 2, px, px);
    }
  }
  ctx.restore();
}

// ─── GARAGE UI ───────────────────────────────────────────────────────────
function renderPartOptions() {
  ['engine', 'tires', 'weight'].forEach(cat => {
    const wrap = document.getElementById('opts-' + cat);
    wrap.innerHTML = partsData[cat].map((opt, i) => `
      <div class="part-opt ${selected[cat] === i ? 'active' : ''}" onclick="selectPart('${cat}', ${i})">
        <div class="opt-name">${opt.name}</div>
        <div class="opt-delta">${opt.desc}</div>
      </div>
    `).join('');
  });
}
function selectPart(cat, i) {
  selected[cat] = i;
  renderPartOptions();
  updateStatBars();
  drawPreview();
}

function renderSwatches() {
  const wrap = document.getElementById('color-swatches');
  wrap.innerHTML = swatchColors.map(c => `
    <div class="swatch ${c === carColor ? 'active' : ''}" style="background:${c}" onclick="pickColor('${c}')"></div>
  `).join('');
}
function pickColor(c) { carColor = c; renderSwatches(); drawPreview(); }

function updateStatBars() {
  const s = computeStats();
  document.getElementById('bar-speed').style.width = (100 * s.topSpeed / MAX.topSpeed) + '%';
  document.getElementById('bar-accel').style.width = (100 * s.accel / MAX.accel) + '%';
  document.getElementById('bar-handling').style.width = (100 * s.handling / MAX.handling) + '%';
}

const previewCtx = document.getElementById('preview-canvas').getContext('2d');
previewCtx.imageSmoothingEnabled = false;
let previewBounce = 0;
function drawPreview() {
  previewCtx.clearRect(0, 0, 120, 160);
  previewBounce += 0.05;
  const bob = Math.sin(previewBounce) * 2;
  drawPixelCar(previewCtx, 60, 80 + bob, -Math.PI / 2, carColor, 7);
  requestAnimationFrame(drawPreview);
}

renderPartOptions();
renderSwatches();
updateStatBars();
drawPreview();

// ─── SCREEN SWITCHING ────────────────────────────────────────────────────
function showScreen(id) {
  ['screen-garage', 'screen-race', 'screen-results'].forEach(s =>
    document.getElementById(s).classList.toggle('hidden', s !== id)
  );
}
function showGarage() { showScreen('screen-garage'); }

// ─── RACE SETUP ──────────────────────────────────────────────────────────
const raceCanvas = document.getElementById('race-canvas');
const rctx = raceCanvas.getContext('2d');
rctx.imageSmoothingEnabled = false;

const CX = 450, CY = 280;
const OUTER_A = 400, OUTER_B = 220;
const INNER_A = 180, INNER_B = 90;
const MID_A = (OUTER_A + INNER_A) / 2, MID_B = (OUTER_B + INNER_B) / 2;
const TOTAL_LAPS = 3;
const RIVAL_OMEGA = 0.52; // rad/s — rival's constant angular speed along the centerline

function onTrack(x, y) {
  const no = ((x - CX) / OUTER_A) ** 2 + ((y - CY) / OUTER_B) ** 2;
  const ni = ((x - CX) / INNER_A) ** 2 + ((y - CY) / INNER_B) ** 2;
  return no <= 1 && ni >= 1;
}

let player, rival, raceTime, raceRunning, raceStartTs, countdownActive;
let keys = {};

function initRace() {
  const stats = computeStats();
  const t0 = -Math.PI / 2;
  player = {
    x: CX + Math.cos(t0) * MID_A,
    y: CY + Math.sin(t0) * MID_B,
    angle: 0,
    speed: 0,
    stats,
    prevAngle: t0,
    unwrapped: 0,
    finishTime: null
  };
  const t0r = t0 - 0.25;
  rival = { t: t0r, startT: t0r, finishTime: null };
  raceTime = 0;
  raceRunning = false;
  countdownActive = true;
}

function startRace() {
  initRace();
  showScreen('screen-race');
  runCountdown();
}

function runCountdown() {
  const el = document.getElementById('countdown');
  el.classList.remove('hidden');
  let n = 3;
  el.textContent = n;
  const iv = setInterval(() => {
    n -= 1;
    if (n > 0) { el.textContent = n; }
    else if (n === 0) { el.textContent = 'GO!'; }
    else {
      clearInterval(iv);
      el.classList.add('hidden');
      raceRunning = true;
      countdownActive = false;
      raceStartTs = performance.now();
      lastFrameTs = raceStartTs;
      requestAnimationFrame(raceLoop);
    }
  }, 700);
}

// ─── INPUT ───────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
}
bindTouch('tb-left', 'ArrowLeft');
bindTouch('tb-right', 'ArrowRight');
bindTouch('tb-gas', 'ArrowUp');
bindTouch('tb-brake', 'ArrowDown');

function isDown(keysArr) { return keysArr.some(k => keys[k]); }

// ─── RACE LOOP ───────────────────────────────────────────────────────────
let lastFrameTs = 0;
function raceLoop(ts) {
  if (!raceRunning) return;
  let dt = (ts - lastFrameTs) / 1000;
  dt = Math.min(dt, 0.05);
  lastFrameTs = ts;
  raceTime += dt;

  updatePlayer(dt);
  updateRival(dt);
  drawRace();
  updateHud();

  if (player.unwrapped >= TOTAL_LAPS * 2 * Math.PI && player.finishTime === null) {
    player.finishTime = raceTime;
    finishRace();
    return;
  }
  requestAnimationFrame(raceLoop);
}

function updatePlayer(dt) {
  const s = player.stats;
  const throttle = isDown(['ArrowUp', 'w', 'W']);
  const brake = isDown(['ArrowDown', 's', 'S']);
  const left = isDown(['ArrowLeft', 'a', 'A']);
  const right = isDown(['ArrowRight', 'd', 'D']);
  const onTrk = onTrack(player.x, player.y);
  const offMult = onTrk ? 1 : (0.5 + s.grip * 0.25 + Math.max(0, -s.stability) * -0.1);
  const cappedTop = s.topSpeed * offMult;

  if (throttle) player.speed += s.accel * dt;
  else if (brake) player.speed -= s.accel * 1.4 * dt;
  else {
    const friction = 90 * dt;
    if (player.speed > 0) player.speed = Math.max(0, player.speed - friction);
    else if (player.speed < 0) player.speed = Math.min(0, player.speed + friction);
  }
  if (!onTrk) player.speed *= 0.985;

  player.speed = Math.max(-s.topSpeed * 0.4, Math.min(cappedTop, player.speed));

  const steerCapability = 0.4 + 0.6 * Math.min(1, Math.abs(player.speed) / s.topSpeed);
  const steerDir = (player.speed >= 0) ? 1 : -1; // reverse flips steering feel
  if (left) player.angle -= s.handling * steerCapability * steerDir * dt;
  if (right) player.angle += s.handling * steerCapability * steerDir * dt;

  player.x += Math.cos(player.angle) * player.speed * dt;
  player.y += Math.sin(player.angle) * player.speed * dt;

  const rawAngle = Math.atan2(player.y - CY, player.x - CX);
  let delta = rawAngle - player.prevAngle;
  if (delta > Math.PI) delta -= 2 * Math.PI;
  if (delta < -Math.PI) delta += 2 * Math.PI;
  player.unwrapped += delta;
  player.prevAngle = rawAngle;
}

function updateRival(dt) {
  if (rival.finishTime !== null) return;
  rival.t += RIVAL_OMEGA * dt;
  if ((rival.t - rival.startT) >= TOTAL_LAPS * 2 * Math.PI) rival.finishTime = raceTime;
}
function rivalPos() {
  return {
    x: CX + Math.cos(rival.t) * MID_A,
    y: CY + Math.sin(rival.t) * MID_B,
    angle: Math.atan2(MID_B * Math.cos(rival.t), -MID_A * Math.sin(rival.t))
  };
}

// ─── DRAWING ─────────────────────────────────────────────────────────────
function drawTrack() {
  rctx.fillStyle = '#12331a';
  rctx.fillRect(0, 0, raceCanvas.width, raceCanvas.height);

  rctx.save();
  rctx.beginPath();
  rctx.ellipse(CX, CY, OUTER_A, OUTER_B, 0, 0, Math.PI * 2);
  rctx.ellipse(CX, CY, INNER_A, INNER_B, 0, 0, Math.PI * 2);
  rctx.fillStyle = '#2b2b33';
  rctx.fill('evenodd');
  rctx.restore();

  // curb stripes (rough, evenly-angled dashes)
  drawCurb(OUTER_A, OUTER_B, 1);
  drawCurb(INNER_A, INNER_B, -1);

  // start/finish line at top
  rctx.save();
  rctx.translate(CX, CY - MID_B);
  for (let i = -3; i <= 3; i++) {
    rctx.fillStyle = (i % 2 === 0) ? '#e8e0ff' : '#111';
    rctx.fillRect(i * 10, -4, 10, 8);
  }
  rctx.restore();

  // grass texture dots
  rctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 40; i++) {
    const gx = (i * 137) % raceCanvas.width;
    const gy = (i * 89) % raceCanvas.height;
    rctx.fillRect(gx, gy, 3, 3);
  }
}
function drawCurb(a, b, dir) {
  const segs = 40;
  for (let i = 0; i < segs; i++) {
    if (i % 2 !== 0) continue;
    const t0 = (i / segs) * Math.PI * 2;
    const t1 = ((i + 1) / segs) * Math.PI * 2;
    rctx.fillStyle = (i % 4 === 0) ? '#c72e3a' : '#e8e0ff';
    rctx.beginPath();
    rctx.ellipse(CX, CY, a, b, 0, t0, t1);
    rctx.lineWidth = 8;
    rctx.strokeStyle = rctx.fillStyle;
    rctx.stroke();
  }
}

function drawRace() {
  drawTrack();
  const rp = rivalPos();
  drawPixelCar(rctx, rp.x, rp.y, rp.angle, '#5a5a6a', 5);
  drawPixelCar(rctx, player.x, player.y, player.angle, carColor, 5);
}

function updateHud() {
  const lap = Math.min(TOTAL_LAPS, Math.floor(player.unwrapped / (2 * Math.PI)) + 1);
  document.getElementById('hud-lap').textContent = `LAP ${lap}/${TOTAL_LAPS}`;
  document.getElementById('hud-time').textContent = formatTime(raceTime);
}
function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = (t % 60).toFixed(1).padStart(4, '0');
  return `${String(m).padStart(2, '0')}:${s}`;
}

// ─── RESULTS ─────────────────────────────────────────────────────────────
function finishRace() {
  raceRunning = false;
  // if rival hasn't finished yet, estimate its finish time analytically
  let rivalTime = rival.finishTime;
  if (rivalTime === null) {
    rivalTime = TOTAL_LAPS * (2 * Math.PI / RIVAL_OMEGA);
  }
  const won = player.finishTime < rivalTime;
  const headline = document.getElementById('results-headline');
  headline.textContent = won ? 'YOU WIN!' : 'RIVAL WINS';
  headline.className = 'results-headline ' + (won ? 'win' : 'lose');
  document.getElementById('results-time').textContent = formatTime(player.finishTime);
  document.getElementById('results-rival-time').textContent = formatTime(rivalTime);
  showScreen('screen-results');
}
</script>
</body>
