name: Update Tasks Calendar

on:
  schedule:
    # Every Monday at 05:00 UTC — keeps the rolling 2-week window fresh
    - cron: '0 5 * * 1'
  workflow_dispatch: {}
  push:
    paths:
      - 'calendar/rules.json'
      - 'calendar/generate_tasks.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tasks.ics
        run: python calendar/generate_tasks.py --rules calendar/rules.json --out calendar/tasks.ics --days 14

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar/tasks.ics
          if git diff --cached --quiet; then
            echo "No changes to tasks.ics"
          else
            git commit -m "Update tasks.ics ($(date -u +%Y-%m-%d))"
            git push
          fi
